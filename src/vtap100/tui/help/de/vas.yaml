section:
  title: Apple VAS (Value Added Services)
  description: |
    Konfiguration für Apple Wallet Pässe.
    Bis zu 6 verschiedene Pass-Konfigurationen möglich.

fields:
  merchant_id:
    title: Merchant ID (Pass Type ID)
    description: |
      Die eindeutige ID deines Apple Wallet Passes.
      Wird im Apple Developer Portal erstellt.
    format: "Muss mit 'pass.' beginnen"
    example: "pass.com.example.loyalty"
    tip: |
      Findest du im Apple Developer Portal unter:
      Certificates, Identifiers & Profiles > Pass Type IDs

  key_slot:
    title: Key Slot
    description: |
      Slot (0-6) in dem der private Schlüssel gespeichert ist.
    values:
      - value: 0
        label: Automatisch (Reader wählt selbst)
      - value: 1-6
        label: Spezifischer Slot
    tip: |
      Der Schlüssel muss als private1.pem (für Slot 1) etc.
      auf den Reader kopiert werden.
      Slot 0 bedeutet automatische Erkennung.

  merchant_url:
    title: Merchant URL (Signup URL)
    description: |
      Optionale Signup-URL für Nutzer, die tippen aber den Pass
      noch nicht installiert haben.

      Wenn ein Nutzer sein iPhone/Apple Watch tippt und kein
      passender Pass gefunden wird, erscheint eine Benachrichtigung
      die zu dieser URL führt, wo der Pass hinzugefügt werden kann.
    required: false
    format: "Muss https:// sein, max. 64 Bytes"
    example: "https://example.com/loyalty/signup"
    tip: |
      Anwendungsfall: Ein Kunde ohne deinen Loyalty-Pass tippt
      den Reader und erhält eine "Jetzt Mitglied werden"
      Benachrichtigung. Ein Tipp darauf öffnet deine Signup-Seite.

      Funktioniert im VAS FULL-Modus (Pass lesen + Signup) oder
      im URL-only-Modus (reines Signup-Terminal).
